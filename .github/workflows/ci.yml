name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: observatory/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: npm --prefix observatory ci
      - run: npm --prefix observatory run build
      - run: node --experimental-strip-types --test observatory/tests/*.test.ts
